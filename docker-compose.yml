services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gunsonu
      POSTGRES_PASSWORD: gunsonu
      POSTGRES_DB: gunsonu
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Süresi dolan anahtarlar için olay yayınla (rezervasyon otomatik iptali)
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"

volumes:
  db_data:
